name: Build

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default token (GitHub's implicit default is not safe to rely on).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: temurin

      # Provisions Gradle (version read from gradle/wrapper/gradle-wrapper.properties)
      # and handles dependency caching, so the wrapper jar need not be committed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper

      - name: Build and test
        run: gradle build --no-daemon
