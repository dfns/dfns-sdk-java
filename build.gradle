plugins {
    id 'java-library'
    id 'maven-publish'
}

group   = 'co.dfns'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// Until the SDK is on Maven Central, consumers install it into their local Maven
// repository (~/.m2) with `./gradlew publishToMavenLocal`. The published POM carries
// the transitive dependencies, so the coordinates below resolve from both Gradle and Maven.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.17.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
